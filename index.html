<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Data Koordinasi Displain</title>
<style id="page-style"></style>
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#222536; --border:#2e3248;
  --accent:#4f8ef7; --accent2:#f7c948; --text:#e8eaf0; --text2:#8b90a7;
  --green:#3ecf8e; --red:#f76e6e; --radius:8px;
  --font:'Inter','Segoe UI',sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#f0f2f8; --surface:#fff; --surface2:#e8eaf3; --border:#d0d4e8; --text:#1a1d27; --text2:#555a7a;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px}

.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:100}
.nav-logo{height:32px;width:auto;object-fit:contain;display:block;flex-shrink:0}
.nav-title{font-weight:700;font-size:15px;color:var(--accent);margin-right:auto;line-height:1.2}
.nav-title small{display:block;font-size:10px;font-weight:400;color:var(--text2)}
.tab-btn{padding:6px 14px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.page{display:none;padding:16px}
.page.active{display:block}

.filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:3px}
.filter-bar label{font-size:10px;color:var(--text2);white-space:nowrap}
.filter-bar select,.filter-bar input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 8px;font-size:12px;outline:none;min-width:110px}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--accent)}
.filter-bar select:disabled{opacity:.5}
.btn{padding:6px 14px;border-radius:var(--radius);border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-warn{background:var(--accent2);color:#111}
.btn:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);opacity:1}
.btn-sm{padding:6px 10px;font-size:11px}

/* Multi-select DC */
.ms-wrap{position:relative;min-width:160px}
.ms-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;font-size:12px;cursor:pointer;min-width:160px;width:100%}
.ms-btn:hover,.ms-btn.open{border-color:var(--accent)}
.ms-btn .ms-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
.ms-btn .ms-arrow{font-size:10px;color:var(--text2);flex-shrink:0}
.ms-drop{display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:220px;max-height:260px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:200;padding:6px}
.ms-drop.open{display:block}
.ms-search{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 8px;font-size:12px;margin-bottom:6px;outline:none}
.ms-search:focus{border-color:var(--accent)}
.ms-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px}
.ms-item:hover{background:var(--surface2)}
.ms-item input{accent-color:var(--accent);width:14px;height:14px}
.ms-actions{display:flex;gap:6px;padding:6px 4px 2px;border-top:1px solid var(--border);margin-top:4px}
.ms-actions button{flex:1;padding:5px;font-size:11px}

.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
thead th{background:var(--surface2);padding:8px 10px;text-align:left;font-size:11px;font-weight:700;color:var(--text2);white-space:nowrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}
thead th .th-inner{display:flex;align-items:center;gap:6px}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:hover{background:var(--surface2)}
td{padding:7px 10px;white-space:nowrap;color:var(--text)}

thead th.col-do{background:#4a3f17;color:#f7c948}
thead th.col-dc{background:#173a5e;color:#7fb2ff}
td.col-do{background:rgba(247,201,72,.13)}
td.col-dc{background:rgba(79,142,247,.13)}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) thead th.col-do{background:#fdf0c4;color:#8a6a00}
  :root:not([data-theme="dark"]) thead th.col-dc{background:#d6e6ff;color:#1f5bb5}
}

.copy-col-btn{background:var(--surface2);border:1px solid var(--border);border-radius:4px;color:var(--text2);padding:2px 7px;font-size:10px;cursor:pointer}
.copy-col-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-col-btn.copied{background:var(--green);color:#fff;border-color:var(--green)}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700}
.tag-true{background:rgba(62,207,142,.15);color:var(--green)}
.tag-false{background:rgba(247,110,110,.15);color:var(--red)}

.stats-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;min-width:110px}
.stat-card .val{font-size:20px;font-weight:800;color:var(--accent)}
.stat-card .lbl{font-size:10px;color:var(--text2);margin-top:2px}

.print-controls{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.print-controls .form-group{display:flex;flex-direction:column;gap:4px}
.print-controls label{font-size:11px;color:var(--text2)}
.print-controls input,.print-controls select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:7px 10px;font-size:13px;outline:none;min-width:150px}
.print-controls input:focus,.print-controls select:focus{border-color:var(--accent)}
.print-controls input[readonly]{opacity:.8;border-style:dashed}
.print-controls .w-sm input,.print-controls .w-sm select{min-width:90px;width:100px}
.data-status{font-size:11px;color:var(--text2);margin-bottom:10px;line-height:1.6}
.data-status b.ok{color:var(--green)} .data-status b.bad{color:var(--red)}
.fallback{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.fallback label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--accent2)}
.fallback label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--text);font-size:12px}
.fallback select{background:var(--surface2);border:1px solid var(--accent2);border-radius:6px;color:var(--text);padding:7px 10px;font-size:12px}

.preview{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.preview .cap{font-size:11px;color:var(--text2)}
.label-img{display:block;border:1px solid var(--border);background:#fff;max-width:100%;height:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{padding:9px 16px;font-size:13px}

.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text2);gap:10px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--text2);font-size:13px}

.pagination{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap}
.page-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-size:12px}
.page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.page-info{font-size:11px;color:var(--text2)}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 18px;font-size:13px;color:var(--text);opacity:0;transition:all .25s;z-index:9999;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

:root[data-theme="light"]{--bg:#f0f2f8;--surface:#fff;--surface2:#e8eaf3;--border:#d0d4e8;--text:#1a1d27;--text2:#555a7a}
:root[data-theme="light"] thead th.col-do{background:#fdf0c4;color:#8a6a00}
:root[data-theme="light"] thead th.col-dc{background:#d6e6ff;color:#1f5bb5}
tbody tr:nth-child(even){background:rgba(127,127,127,.06)}
td.rn,th.rn{color:var(--text2);text-align:right;width:1%;font-size:11px}
.th-sort{cursor:pointer;user-select:none}
.th-sort:hover{color:var(--accent)}
:root{--dc-l:68%}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--dc-l:38%}}
:root[data-theme="light"]{--dc-l:38%}
.print-only{display:none}
.hist{margin-top:18px}
.hist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px}
.hist-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;margin-bottom:6px;cursor:pointer;font-size:12px}
.hist-row:hover{border-color:var(--accent)}
.hist-sub{font-size:10px;color:var(--text2);margin-top:2px}

/* ===== KARTU PENCARIAN ===== */
.search-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:6px}
.search-empty{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--text2)}
.search-empty .ico{font-size:36px;margin-bottom:10px;opacity:.5}
.search-stats{display:inline-block;font-size:12px;color:var(--text2);margin-bottom:12px;padding:7px 12px;background:var(--surface);border:1px solid var(--border);border-radius:999px}
.sc2{background:var(--surface);border:1px solid var(--border);border-top:4px solid hsl(var(--dc),75%,55%);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.10);transition:transform .15s,box-shadow .15s}
.sc2:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.sc2-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sc2-dc{font-size:13px;font-weight:800;letter-spacing:.2px;padding:5px 11px;border-radius:999px;background:hsla(var(--dc),75%,55%,.16);color:hsl(var(--dc),75%,var(--dc-l));word-break:break-word}
.sc2-st{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.sc2-st.yes{background:rgba(62,207,142,.16);color:var(--green)}
.sc2-st.no{background:rgba(247,110,110,.16);color:var(--red)}
.sc2-ket{font-size:13px;font-weight:600;line-height:1.4;padding:8px 10px;border-left:3px solid hsl(var(--dc),75%,55%);background:var(--surface2);border-radius:0 8px 8px 0;word-break:break-word}
.sc2-hero{display:flex;align-items:stretch;justify-content:space-between;gap:12px}
.sc2-prod{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;justify-content:center}
.sc2-prod b{font-size:16px;font-weight:800;line-height:1.3;word-break:break-word}
.sc2-prod .tl-k{color:hsl(150,60%,var(--dc-l))}
.sc2-pcs{flex:none;min-width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;padding:8px 12px;background:hsla(330,75%,55%,.14)}
.sc2-pcs b{font-size:26px;font-weight:900;line-height:1;color:hsl(330,75%,var(--dc-l))}
.sc2-pcs span{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--text2);margin-top:4px}
.sc2-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:10px;border-left:3px solid hsl(var(--h),70%,55%);background:hsla(var(--h),70%,55%,.10);cursor:pointer;min-width:0}
.tl.full{grid-column:1/-1}
.tl:active{transform:scale(.98)}
.tl-k{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:hsl(var(--h,0),70%,var(--dc-l))}
.tl-v{font-size:14px;font-weight:700;word-break:break-all}
.tl.empty .tl-v{opacity:.4;font-weight:500}
.sc2 .sc-more{border-top:1px dashed var(--border);padding-top:8px}
.sc2-all{margin-top:8px;max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.sc2-all .sc-all-row{padding:6px 10px;border-bottom:1px solid var(--border)}
.sc2-all .sc-all-row:nth-child(even){background:rgba(127,127,127,.07)}
.sc2-all .sc-all-row b{text-align:right;word-break:break-all}
.sc-more summary{cursor:pointer;font-size:11px;color:var(--text2)}
.sc-all-row{display:flex;justify-content:space-between;gap:12px;font-size:11px;padding:3px 0;border-bottom:1px dashed var(--border)}
.sc-all-row span{color:var(--text2)}
.sc-blk{display:block;font-size:10px;font-weight:600;color:var(--text2);margin-top:4px}
.more-bar{display:flex;gap:8px;justify-content:center;margin:14px 0;grid-column:1/-1}

@media print{
  .print-only{display:block!important}
  .label-img{page-break-after:always}
  .label-img:last-of-type{page-break-after:auto}
}
@media print{
  html,body{background:#fff!important;height:auto}
  .nav,.print-controls,.no-print,.data-status,.fallback,.actions,.cap{display:none!important}
  .page{padding:0!important}
  .preview{display:block}
  .label-img{border:none!important;max-width:none!important}
}
/* ===== KARTU BERWARNA PER DC ===== */
:root{--card-s:42%;--card-l:21%;--tile-bg:rgba(0,0,0,.30)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--card-s:80%;--card-l:92%;--tile-bg:rgba(255,255,255,.75)}}
:root[data-theme="light"]{--card-s:80%;--card-l:92%;--tile-bg:rgba(255,255,255,.75)}
.sc2{background:hsl(var(--dc),var(--card-s),var(--card-l));border:1px solid hsl(var(--dc),60%,48%);border-top:6px solid hsl(var(--dc),78%,52%)}
.sc2-dc{background:hsl(var(--dc),72%,36%);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sc2-st.yes{background:#1f9d6b;color:#fff}
.sc2-st.no{background:#c0392b;color:#fff}
.sc2-ket{background:var(--tile-bg);border-left-color:hsl(var(--dc),78%,52%)}
.sc2-pcs{background:var(--tile-bg)}
.tl{background:var(--tile-bg)}
.sc2-all{background:var(--tile-bg)}
.sc2 .sc-more{border-top-color:hsla(var(--dc),60%,50%,.5)}
.sc2 .sc-more summary{color:var(--text)}
.sc2-all .sc-all-row:nth-child(even){background:rgba(127,127,127,.14)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;max-height:116px;overflow:auto}
.lg-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;border:2px solid transparent;background:hsl(var(--dc),72%,36%)}
.lg-chip i{font-style:normal;background:rgba(255,255,255,.25);border-radius:999px;padding:1px 7px}
.lg-chip.on{border-color:var(--text)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<nav class="nav">
  <img class="nav-logo" src="https://res.cloudinary.com/vf5nikiz/image/upload/v1785164146/IMG_20260707_085722_slsyiz.jpg" alt="ParagonCorp" title="ParagonCorp"/>
  <span class="nav-title">📦 Koordinasi Displain<small id="upd">memuat data…</small></span>
  <button class="tab-btn active" onclick="switchTab('md1')">Master Data 1</button>
  <button class="tab-btn" onclick="switchTab('md2')">Master Data 2</button>
  <button class="tab-btn" onclick="switchTab('search')">Pencarian</button>
  <button class="tab-btn" onclick="switchTab('print')">Print Label</button>
  <button class="tab-btn" onclick="refreshData()" title="Muat ulang data">↻</button>
  <button class="tab-btn" onclick="toggleTheme()" title="Ganti tema">🌓</button>
</nav>

<div id="toast"></div>

<!-- MASTER DATA 1 -->
<div id="page-md1" class="page active">
  <div class="stats-row">
    <div class="stat-card"><div class="val" id="s-total-md1">-</div><div class="lbl">Total Rows</div></div>
    <div class="stat-card"><div class="val" id="s-done-md1">-</div><div class="lbl">DONE = TRUE</div></div>
    <div class="stat-card"><div class="val" id="s-filtered-md1">-</div><div class="lbl">Filtered</div></div>
    <div class="stat-card"><div class="val" id="s-cols-md1">-</div><div class="lbl">Kolom</div></div>
  </div>
  <div class="filter-bar no-print">
    <div class="fg"><label>Tanggal</label><select id="f-tgl" onchange="onMd1ScopeChange()"></select></div>
    <div class="fg"><label>Shift</label><select id="f-shift" onchange="onMd1ScopeChange()"></select></div>
    <div class="fg"><label>Plant</label><select id="f-plant" onchange="onMd1ScopeChange()"></select></div>
    <div class="fg">
      <label>DC (multi-pilih)</label>
      <div class="ms-wrap" id="ms-dc-wrap">
        <button type="button" class="ms-btn" id="ms-dc-btn" onclick="toggleMsDc(event)">
          <span class="ms-label" id="ms-dc-label">Semua</span>
          <span class="ms-arrow">▼</span>
        </button>
        <div class="ms-drop" id="ms-dc-drop">
          <input type="text" class="ms-search" id="ms-dc-search" placeholder="Cari DC..." oninput="filterMsDc()"/>
          <div id="ms-dc-list"></div>
          <div class="ms-actions">
            <button class="btn btn-outline btn-sm" onclick="msDcSelectAll(true)">Semua</button>
            <button class="btn btn-outline btn-sm" onclick="msDcSelectAll(false)">Kosong</button>
          </div>
        </div>
      </div>
    </div>
    <div class="fg"><label>Cari nilai</label><input type="text" id="filter-val-md1" placeholder="Cari..." oninput="applyFilter('md1')"/></div>
    <button class="btn btn-outline btn-sm" onclick="clearFilter('md1')">Reset</button>
    <button class="btn btn-outline btn-sm" onclick="loadTable('md1')">↻ Refresh</button>
    <button class="btn btn-primary btn-sm" onclick="copyAllVisible('md1')">Copy Semua Visible</button>
    <button class="btn btn-outline btn-sm" onclick="exportCsv('md1')">⬇ CSV</button>
  </div>
  <div class="tbl-wrap" id="tbl-wrap-md1"><div class="loading"><div class="spinner"></div> Memuat Master Data 1...</div></div>
  <div class="pagination no-print" id="pagination-md1"></div>
</div>

<!-- MASTER DATA 2 -->
<div id="page-md2" class="page">
  <div class="stats-row">
    <div class="stat-card"><div class="val" id="s-total-md2">-</div><div class="lbl">Total Rows</div></div>
    <div class="stat-card"><div class="val" id="s-done-md2">-</div><div class="lbl">DONE = TRUE</div></div>
    <div class="stat-card"><div class="val" id="s-filtered-md2">-</div><div class="lbl">Filtered</div></div>
    <div class="stat-card"><div class="val" id="s-cols-md2">-</div><div class="lbl">Kolom</div></div>
  </div>
  <div class="filter-bar no-print">
    <div class="fg"><label>Kolom</label><select id="filter-col-md2" onchange="applyFilter('md2')"><option value="">-- Semua --</option></select></div>
    <div class="fg"><label>Cari nilai</label><input type="text" id="filter-val-md2" placeholder="Cari..." oninput="applyFilter('md2')"/></div>
    <button class="btn btn-outline btn-sm" onclick="clearFilter('md2')">Reset</button>
    <button class="btn btn-outline btn-sm" onclick="loadTable('md2')">↻ Refresh</button>
    <button class="btn btn-primary btn-sm" onclick="copyAllVisible('md2')">Copy Semua Visible</button>
    <button class="btn btn-outline btn-sm" onclick="exportCsv('md2')">⬇ CSV</button>
  </div>
  <div class="tbl-wrap" id="tbl-wrap-md2"><div class="loading"><div class="spinner"></div> Memuat Master Data 2...</div></div>
  <div class="pagination no-print" id="pagination-md2"></div>
</div>

<!-- PENCARIAN DATA (kartu) -->
<div id="page-search" class="page">
  <div class="filter-bar no-print">
    <div class="fg"><label>Semua kolom</label><input type="text" id="s-all" placeholder="Cari di semua kolom..." oninput="runSearch()"/></div>
    <div class="fg"><label>DC</label><input type="text" id="s-dc" placeholder="Filter DC..." oninput="runSearch()"/></div>
    <div class="fg"><label>WO</label><input type="text" id="s-wo" placeholder="Filter WO..." oninput="runSearch()"/></div>
    <div class="fg"><label>DO</label><input type="text" id="s-do" placeholder="Filter DO..." oninput="runSearch()"/></div>
    <div class="fg"><label>Produk</label><input type="text" id="s-produk" placeholder="Filter Produk..." oninput="runSearch()"/></div>
    <div class="fg"><label>Batch</label><input type="text" id="s-batch" placeholder="Filter Batch..." oninput="runSearch()"/></div>
    <div class="fg"><label>Bin</label><input type="text" id="s-bin" placeholder="Filter Bin..." oninput="runSearch()"/></div>
    <div class="fg"><label>Pcs</label><input type="text" id="s-pcs" placeholder="Filter Pcs..." oninput="runSearch()"/></div>
    <button class="btn btn-outline btn-sm" onclick="clearSearch()">Reset</button>
  </div>
  <div class="search-stats no-print" id="search-stats">Memuat Master Data 2…</div>
  <div class="legend no-print" id="search-legend"></div>
  <div id="search-results" class="search-grid">
    <div class="search-empty"><div class="ico">⏳</div>Menunggu Master Data 2...</div>
  </div>
</div>

<!-- PRINT -->
<div id="page-print" class="page">
  <div class="data-status no-print" id="data-status"></div>
  <div class="fallback no-print" id="fallback"></div>
  <div class="print-controls no-print">
    <div class="form-group">
      <label>No DO (ada di Master Data 1 &amp; 2)</label>
      <input type="text" id="search-do" list="do-list" placeholder="Pilih / ketik / scan No DO" autocomplete="off"
             onfocus="this.select()" oninput="onDoChange(); liveLabel()" onchange="onDoChange(); liveLabel()"/>
      <datalist id="do-list"></datalist>
    </div>
    <div class="form-group">
      <label>To (otomatis, Master Data 1)</label>
      <input type="text" id="to-auto" readonly placeholder="terisi otomatis"/>
    </div>
    <div class="form-group">
      <label>Ship to Desc (otomatis, Master Data 2)</label>
      <input type="text" id="ship-auto" readonly placeholder="terisi otomatis"/>
    </div>
    <div class="form-group">
      <label>Resource (nama Picker, Master Data 2)</label>
      <select id="resource-sel" onchange="liveLabel()"><option value="">— pilih picker —</option></select>
    </div>
    <div class="form-group w-sm">
      <label>Koli (manual)</label>
      <input type="number" id="koli-qty" min="1" value="1" oninput="liveLabel()"/>
    </div>
    <div class="form-group w-sm">
      <label>Satuan</label>
      <select id="koli-unit" onchange="liveLabel()"><option value="CAR">CAR</option><option value="IBX">IBX</option><option value="PC">PC</option></select>
    </div>
    <div class="form-group w-sm">
      <label>Salinan</label>
      <input type="number" id="copies" min="1" max="50" value="1" oninput="liveLabel()"/>
    </div>
    <div class="form-group">
      <label>No Ship HU (manual)</label>
      <input type="text" id="ship-hu" placeholder="mis. 103410000471429" inputmode="numeric" oninput="liveLabel()" onkeydown="if(event.key==='Enter')liveLabel()"/>
    </div>
    <div class="form-group">
      <label>Ukuran Label</label>
      <select id="label-size" onchange="liveLabel()">
        <option value="76x50">76×50 mm</option>
        <option value="a4l">Besar (landscape)</option>
        <option value="a4p2">Besar (portrait)</option>
      </select>
    </div>
    <button class="btn btn-outline" onclick="resetForm()">Reset</button>
  </div>

  <div id="label-output">
    <div class="empty">Label live — isi form di atas, pratinjau muncul otomatis</div>
  </div>
  <div id="hist" class="hist no-print"></div>
</div>

<script>
// ==================== API ====================
var APP_URL = 'https://script.google.com/macros/s/AKfycbx070HjAAF-lszP7anIsKT7FHGodQe8MZHeP0aWVvAvBUDI9wOgkyL7s7uNnuceuwF2/exec';

function callApi(action, params) {
  var qs = new URLSearchParams(Object.assign({ action: action, _t: Date.now() }, params || {}));
  return fetch(APP_URL + '?' + qs.toString())
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d) { if (d && d.error) throw new Error(d.error); return d; });
}

// ==================== STATE ====================
var T = {
  md1: { name: 'Master Data 1', action: 'getMasterData1', headers: [], rows: [], filtered: [], page: 1, perPage: 50, ok: false, err: '' },
  md2: { name: 'Master Data 2', action: 'getMasterData2', headers: [], rows: [], filtered: [], page: 1, perPage: 1000000, ok: false, err: '' }
};
var TABS = ['md1', 'md2', 'search', 'print'];
var MS_DC_SELECTED = [];

function el(id) { return document.getElementById(id); }

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b, i) {
    if (i < TABS.length) b.classList.toggle('active', TABS[i] === tab);
  });
  TABS.forEach(function(t) { el('page-' + t).classList.toggle('active', t === tab); });
  if (tab === 'search') runSearch();
}
function toast(msg, dur) {
  var t = el('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, dur || 2000);
}
function escHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function norm(s) { return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, ''); }
function findCol(headers, aliases) {
  var nh = headers.map(norm);
  for (var i = 0; i < aliases.length; i++) { var x = nh.indexOf(aliases[i]); if (x >= 0) return x; }
  return -1;
}
function firstIdx(nh, fn) { for (var i = 0; i < nh.length; i++) if (fn(nh[i])) return i; return -1; }
function cell(row, idx) { return idx >= 0 && row[idx] != null ? String(row[idx]).trim() : ''; }
function normDate(v) { return String(v).replace(/^(\d{4}-\d{2}-\d{2})T.*$/, '$1'); }

// ==================== DETEKSI KOLOM ====================
var ALIAS_DO = ['nodo', 'do', 'deliveryorder', 'nomordo', 'delivery'];
var SPEC = {
  tgl:    { sheet: 'md1', alias: ['tanggal','tgl','date','tanggaldo','tanggalpicking','tglpicking','createdate'] },
  shift:  { sheet: 'md1', alias: ['shift'] },
  plant:  { sheet: 'md1', alias: ['plant','plan','plnt'] },
  dc:     { sheet: 'md1', alias: ['namadc','dc','shiptodesc','tujuan'] },
  doMd1:  { sheet: 'md1', alias: ALIAS_DO },
  to:     { sheet: 'md1', label: 'Kolom kode DC / To (Master Data 1)',
            alias: ['kodedc','kddc','dccode','kodeto','to','shiptocode','kodetujuan'],
            fuzzy: function(nh) {
              var i = firstIdx(nh, function(n) { return n.indexOf('kode') >= 0 && n.indexOf('dc') >= 0; });
              if (i < 0) i = firstIdx(nh, function(n) { return n.indexOf('dc') >= 0 && n.indexOf('nama') < 0 && n.indexOf('desc') < 0; });
              return i;
            } },
  doMd2:  { sheet: 'md2', alias: ALIAS_DO },
  shipTo: { sheet: 'md2', alias: ['shiptodesc','shiptodescription','namadc','shipto','namatujuan'] },
  picker: { sheet: 'md2', label: 'Kolom nama Picker (Master Data 2)',
            alias: ['namapicker','picker','pickername','resource','operator','namaoperator','petugas'],
            fuzzy: function(nh) {
              return firstIdx(nh, function(n) { return n.indexOf('picker') >= 0 || n.indexOf('resource') >= 0 || n.indexOf('operator') >= 0 || n.indexOf('petugas') >= 0; });
            } },
  wo:     { sheet: 'md1', alias: ['wo','workorder','nowo','nomorwo','wono','no wo','no.wo'] },
  produk: { sheet: 'md1', alias: ['produk','product','namaproduk','material','item','sku','namabarang','materialdescription','matdesc','deskripsi'] },
  batch:  { sheet: 'md1', alias: ['batch','nobatch','batchno','lot','lotno','nobatch','batch number'] },
  bin:    { sheet: 'md1', alias: ['bin','lokasi','location','binloc','storagebin','rak','bin location','storagelocation'] },
  pcs:    { sheet: 'md1', alias: ['pcs','qty','quantity','jumlah','jumlahpcs','qtypcs','qty pcs','jumlah pcs'] },
  ket:    { sheet: 'md1', alias: ['keterangan','ket','description','desc','catatan','remark','keterangandc'] }
};

var OV = {};
try { OV = JSON.parse(localStorage.getItem('kd_ov') || '{}') || {}; } catch (e) { OV = {}; }
if (typeof OV.picker === 'string') OV.picker = [OV.picker];
var PK_OPEN = false;
function saveOv() { try { localStorage.setItem('kd_ov', JSON.stringify(OV)); } catch (e) {} }

function colAuto(id) {
  var s = SPEC[id], h = T[s.sheet].headers;
  var i = findCol(h, s.alias);
  if (i < 0 && s.fuzzy) i = s.fuzzy(h.map(norm));
  return i;
}
function colOf(id) {
  var s = SPEC[id];
  if (OV[id]) { var i = T[s.sheet].headers.indexOf(OV[id]); if (i >= 0) return i; }
  return colAuto(id);
}
function setOv(id, name) {
  if (name) OV[id] = name; else delete OV[id];
  saveOv(); refreshAll();
}
function pickerCols() {
  var h = T.md2.headers, out = [];
  if (OV.picker && OV.picker.length) {
    OV.picker.forEach(function(n) { var i = h.indexOf(n); if (i >= 0) out.push(i); });
    if (out.length) return out;
  }
  h.forEach(function(x, i) {
    var n = norm(x);
    if (n.indexOf('picker') >= 0 || n.indexOf('resource') >= 0 || n.indexOf('operator') >= 0 || n.indexOf('petugas') >= 0) out.push(i);
  });
  return out;
}
function setPickerOv() {
  var v = [];
  document.querySelectorAll('#fallback input[data-pk]').forEach(function(cb) { if (cb.checked) v.push(cb.value); });
  if (v.length) OV.picker = v; else delete OV.picker;
  PK_OPEN = true; saveOv(); refreshAll();
}
function renderFallback() {
  var html = '', s = SPEC.to, t1 = T.md1;
  if (t1.ok && t1.headers.length && (colAuto('to') < 0 || OV.to)) {
    html += '<label>⚠ ' + s.label + ' tidak terbaca otomatis — pilih kolomnya:' +
      '<select onchange="setOv(\'to\',this.value)"><option value="">-- pilih kolom --</option>' +
      t1.headers.map(function(n) { return '<option value="' + escHtml(n) + '"' + (OV.to === n ? ' selected' : '') + '>' + escHtml(n) + '</option>'; }).join('') +
      '</select></label>';
  }
  var t2 = T.md2;
  if (t2.ok && t2.headers.length) {
    var pc = pickerCols(), names = pc.map(function(i) { return t2.headers[i]; });
    html += '<details style="width:100%"' + ((!names.length || PK_OPEN) ? ' open' : '') + '>' +
      '<summary style="cursor:pointer;color:var(--accent2)">Kolom picker terbaca: ' +
      (names.length ? names.map(escHtml).join(', ') : '<b>tidak ada</b>') + ' (ubah)</summary>' +
      '<div class="fallback" style="margin:8px 0 0">' +
      t2.headers.map(function(n) {
        return '<label class="ck"><input type="checkbox" data-pk value="' + escHtml(n) + '"' + (names.indexOf(n) >= 0 ? ' checked' : '') + ' onchange="setPickerOv()"/> ' + escHtml(n) + '</label>';
      }).join('') + '</div></details>';
  }
  el('fallback').innerHTML = html;
}
function refreshAll() {
  refreshMd1Filters(); applyFilter('md1'); if (T.md1.ok) renderTable('md1'); rebuildDoList(); onDoChange();
  if (el('page-search').classList.contains('active')) runSearch();
}

// ==================== NORMALISASI DATA ====================
function colLetter(i) {
  var s = '';
  for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
  return s;
}
function normalizeData(d) {
  var headers = [], rows = [];
  if (d && !Array.isArray(d) && d.values && Array.isArray(d.values)) d = d.values;
  if (Array.isArray(d)) {
    if (d.length && Array.isArray(d[0])) { headers = d[0].slice(); rows = d.slice(1); }
    else if (d.length && typeof d[0] === 'object') {
      var seen = {};
      d.forEach(function(o) { Object.keys(o).forEach(function(k) { if (!seen[k]) { seen[k] = 1; headers.push(k); } }); });
      rows = d.map(function(o) { return headers.map(function(h) { return o[h]; }); });
    }
  } else if (d) {
    headers = (d.headers || []).slice();
    rows = d.rows || [];
    if (rows.length && !Array.isArray(rows[0]) && typeof rows[0] === 'object') {
      rows = rows.map(function(o) { return headers.map(function(h) { return o[h]; }); });
    }
  }
  var n = headers.length;
  rows.forEach(function(r) { if (r.length > n) n = r.length; });
  for (var i = 0; i < n; i++) {
    if (headers[i] == null || String(headers[i]).trim() === '') headers[i] = 'Kolom ' + colLetter(i);
  }
  rows = rows.map(function(r) { var c = r.slice(); while (c.length < n) c.push(''); return c; });
  return { headers: headers, rows: rows };
}

// ==================== MULTI-SELECT DC ====================
function toggleMsDc(e) {
  e.stopPropagation();
  var drop = el('ms-dc-drop');
  var open = drop.classList.toggle('open');
  el('ms-dc-btn').classList.toggle('open', open);
  if (open) el('ms-dc-search').focus();
}
function closeMsDc() {
  el('ms-dc-drop').classList.remove('open');
  el('ms-dc-btn').classList.remove('open');
}
document.addEventListener('click', function(e) {
  if (!el('ms-dc-wrap').contains(e.target)) closeMsDc();
});

function buildMsDcList() {
  var idx = colOf('dc');
  var list = el('ms-dc-list');
  if (idx < 0 || !T.md1.ok) {
    list.innerHTML = '<div class="ms-item" style="color:var(--text2)">(kolom DC tidak ada)</div>';
    return;
  }
  var rows = T.md1.rows.filter(function(r) {
    for (var n = 0; n < MD1_FILTERS.length; n++) {
      var f = MD1_FILTERS[n], v = el(f[1]).value, i = colOf(f[0]);
      if (v && i >= 0 && fv(f[0], r[i]) !== v) return false;
    }
    return true;
  });
  var set = {};
  rows.forEach(function(r) { var v = cell(r, idx); if (v) set[v] = 1; });
  var vals = Object.keys(set).sort(function(a, b) { return a.localeCompare(b, undefined, { numeric: true }); });

  MS_DC_SELECTED = MS_DC_SELECTED.filter(function(v) { return set[v]; });

  if (!vals.length) {
    list.innerHTML = '<div class="ms-item" style="color:var(--text2)">(tidak ada DC di filter ini)</div>';
  } else {
    list.innerHTML = vals.map(function(v) {
      var checked = MS_DC_SELECTED.indexOf(v) >= 0 ? ' checked' : '';
      return '<label class="ms-item"><input type="checkbox" value="' + escHtml(v) + '"' + checked + ' onchange="onMsDcChange()"/> ' + escHtml(v) + '</label>';
    }).join('');
  }
  updateMsDcLabel();
}
function filterMsDc() {
  var q = el('ms-dc-search').value.toLowerCase().trim();
  el('ms-dc-list').querySelectorAll('.ms-item').forEach(function(item) {
    var t = item.textContent.toLowerCase();
    item.style.display = (!q || t.indexOf(q) >= 0) ? '' : 'none';
  });
}
function onMsDcChange() {
  MS_DC_SELECTED = [];
  el('ms-dc-list').querySelectorAll('input[type=checkbox]').forEach(function(cb) {
    if (cb.checked) MS_DC_SELECTED.push(cb.value);
  });
  updateMsDcLabel();
  applyFilter('md1');
}
function msDcSelectAll(all) {
  el('ms-dc-list').querySelectorAll('input[type=checkbox]').forEach(function(cb) {
    if (cb.parentElement.style.display === 'none') return;
    cb.checked = all;
  });
  onMsDcChange();
}
function updateMsDcLabel() {
  var lab = el('ms-dc-label');
  if (!MS_DC_SELECTED.length) lab.textContent = 'Semua';
  else if (MS_DC_SELECTED.length === 1) lab.textContent = MS_DC_SELECTED[0];
  else lab.textContent = MS_DC_SELECTED.length + ' DC dipilih';
}
function onMd1ScopeChange() {
  buildMsDcList();
  applyFilter('md1');
}

// ==================== TABEL ====================
function loadTable(k) {
  var t = T[k];
  el('tbl-wrap-' + k).innerHTML = '<div class="loading"><div class="spinner"></div> Memuat ' + t.name + '...</div>';
  return callApi(t.action)
    .then(function(d) {
      var nd = normalizeData(d); t.headers = nd.headers; t.rows = nd.rows;
      t.filtered = t.rows; t.page = 1; t.ok = true; t.err = '';
      buildFilterDropdown(k); renderTable(k); updateStats(k);
    })
    .catch(function(e) {
      t.ok = false; t.err = e.message;
      el('tbl-wrap-' + k).innerHTML = '<div class="empty">❌ Gagal memuat ' + t.name + ': ' + escHtml(e.message) + '</div>';
    })
    .then(function() { buildDcColors(); if (T.md2.ok) renderTable('md2'); refreshMd1Filters(); applyFilter('md1'); rebuildDoList(); runSearch(); setUpdated(); });
}

function buildFilterDropdown(k) {
  var sel = el('filter-col-' + k);
  if (!sel) return;
  sel.innerHTML = '<option value="">-- Semua Kolom --</option>';
  T[k].headers.forEach(function(h, i) {
    var o = document.createElement('option'); o.value = i; o.textContent = h || ('Kolom ' + i); sel.appendChild(o);
  });
}

var MD1_FILTERS = [['tgl', 'f-tgl', 'Tanggal'], ['shift', 'f-shift', 'Shift'], ['plant', 'f-plant', 'Plant']];
function fv(id, v) { v = String(v == null ? '' : v).trim(); return id === 'tgl' ? normDate(v) : v; }

function refreshMd1Filters() {
  MD1_FILTERS.forEach(function(f) {
    var sel = el(f[1]), cur = sel.value, idx = colOf(f[0]);
    sel.innerHTML = '<option value="">Semua</option>';
    if (idx < 0) { sel.disabled = true; sel.options[0].textContent = '(kolom tidak ada)'; return; }
    sel.disabled = false;
    var set = {};
    T.md1.rows.forEach(function(r) { var v = fv(f[0], r[idx]); if (v !== '') set[v] = 1; });
    var vals = Object.keys(set).sort(function(a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
    if (f[0] === 'tgl') vals.reverse();
    vals.forEach(function(v) { var o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); });
    if (cur && set[cur]) sel.value = cur;
  });
  buildMsDcList();
}

function applyFilter(k) {
  var t = T[k];
  var cs = el('filter-col-' + k), colIdx = cs ? cs.value : '';
  var val = el('filter-val-' + k).value.toLowerCase().trim();
  var ex = [];
  if (k === 'md1') {
    MD1_FILTERS.forEach(function(f) {
      var v = el(f[1]).value, i = colOf(f[0]);
      if (v && i >= 0) ex.push({ id: f[0], i: i, v: v });
    });
  }
  t.filtered = t.rows.filter(function(r) {
    for (var n = 0; n < ex.length; n++) if (fv(ex[n].id, r[ex[n].i]) !== ex[n].v) return false;
    if (k === 'md1' && MS_DC_SELECTED.length) {
      var di = colOf('dc');
      if (di >= 0) {
        var dv = cell(r, di);
        if (MS_DC_SELECTED.indexOf(dv) < 0) return false;
      }
    }
    if (!val) return true;
    if (colIdx === '') return r.some(function(c) { return String(c).toLowerCase().includes(val); });
    return String(r[parseInt(colIdx)]).toLowerCase().includes(val);
  });
  sortRows(t);
  t.page = 1; renderTable(k); updateStats(k);
}

function clearFilter(k) {
  el('filter-val-' + k).value = '';
  var cs = el('filter-col-' + k); if (cs) cs.value = '';
  if (k === 'md1') {
    MD1_FILTERS.forEach(function(f) { el(f[1]).value = ''; });
    MS_DC_SELECTED = [];
    buildMsDcList();
  }
  applyFilter(k);
}

function updateStats(k) {
  var t = T[k];
  el('s-total-' + k).textContent = t.rows.length;
  var di = t.headers.findIndex(function(h) { return String(h).toUpperCase() === 'DONE'; });
  el('s-done-' + k).textContent = di >= 0 ? t.rows.filter(function(r) { return String(r[di]).toUpperCase() === 'TRUE'; }).length : '-';
  el('s-filtered-' + k).textContent = t.filtered.length;
  el('s-cols-' + k).textContent = t.headers.length;
}

function md1ColClasses() {
  var cls = {};
  T.md1.headers.forEach(function(h, i) {
    var n = norm(h);
    if (n === 'namadc' || n === 'dc' || n === 'kodedc' || n === 'kddc' || n === 'dccode') cls[i] = 'col-dc';
  });
  var c;
  if ((c = colOf('dc')) >= 0) cls[c] = 'col-dc';
  if ((c = colOf('to')) >= 0) cls[c] = 'col-dc';
  if ((c = colOf('doMd1')) >= 0) cls[c] = 'col-do';
  return cls;
}

var DC_HUE = {};
function buildDcColors() {
  var set = {};
  var ic = colOf('dc'), is = colOf('shipTo');
  if (T.md1.ok && ic >= 0) T.md1.rows.forEach(function(r) { var v = cell(r, ic).toUpperCase(); if (v) set[v] = 1; });
  if (T.md2.ok && is >= 0) T.md2.rows.forEach(function(r) { var v = cell(r, is).toUpperCase(); if (v) set[v] = 1; });
  if (T.md2.ok) {
    var base = baseCols(), nB = Math.ceil(T.md2.headers.length / BLOCK), cb = [];
    for (var bb = 0; bb < nB; bb++) cb.push(blockCols(bb, base));
    T.md2.rows.forEach(function(row) {
      for (var b2 = 0; b2 < nB; b2++) { var v2 = makeRec(row, b2, cb).val('dc').toUpperCase(); if (v2) set[v2] = 1; }
    });
  }
  DC_HUE = {};
  Object.keys(set).sort().forEach(function(n, i) { DC_HUE[n] = Math.round((i * 137.508) % 360); });
}
function dcStyle(name) {
  var h = DC_HUE[String(name || '').trim().toUpperCase()];
  return h == null ? '' : ' style="color:hsl(' + h + ',75%,var(--dc-l));font-weight:600"';
}

function renderTable(k) {
  var t = T[k], wrap = el('tbl-wrap-' + k);
  if (!t.headers.length) { wrap.innerHTML = '<div class="empty">Tidak ada data</div>'; return; }
  var cls = k === 'md1' ? md1ColClasses() : {};
  var dcCol = k === 'md1' ? colOf('dc') : colOf('shipTo');

var BLOCK = 16;   // Master Data 2 tersusun per blok 16 kolom: A–P, Q–AF, AG–AV, dst.

function md2Col(aliases, fuzzyFn) {
  if (!T.md2.ok) return -1;

// deteksi kolom dari satu set header (posisi relatif terhadap header itu)
function detectCols(h) {
  function c(al, fz) { var i = findCol(h, al); if (i < 0 && fz) i = fz(h.map(norm)); return i; }
  var pk = function(nh) { return firstIdx(nh, function(n) { return n.indexOf('picker') >= 0 || n.indexOf('resource') >= 0 || n.indexOf('operator') >= 0 || n.indexOf('petugas') >= 0; }); };
  return {
    do:     c(ALIAS_DO),
    dc:     c(['namadc','dc','shiptodesc','tujuan','shipto','namatujuan']),
    wo:     c(['wo','workorder','nowo','nomorwo','wono']),
    produk: c(['produk','product','namaproduk','material','item','sku','namabarang','materialdescription','matdesc','deskripsi','materialdesc']),
    batch:  c(['batch','nobatch','batchno','lot','lotno']),
    bin:    c(['bin','lokasi','location','binloc','storagebin','rak','binlocation','storagelocation']),
    pcs:    c(['pcs','qty','quantity','jumlah','jumlahpcs','qtypcs','confirmedqty','pickqty']),
    ket:    c(['ket','keterangan','description','desc','catatan','remark','keterangandc']),
    done:   c(['done','status','selesai']),
    picker: c(['namapicker','picker','pickername','resource','operator','namaoperator','petugas'], pk)
  };
}
function baseCols() {
  var H = T.md2.headers, base = detectCols(H.slice(0, BLOCK));
  if (base.picker < 0) { var pc = pickerCols().filter(function(i) { return i < BLOCK; }); if (pc.length) base.picker = pc[0]; }
  if (base.dc < 0) { var si = colOf('shipTo'); if (si >= 0 && si < BLOCK) base.dc = si; }
  return base;
}
// posisi kolom (absolut) untuk blok ke-b; jika header blok tidak terbaca, pakai posisi blok pertama
function blockCols(b, base) {
  var H = T.md2.headers, off = b * BLOCK;
  var own = b === 0 ? base : detectCols(H.slice(off, off + BLOCK));
  var out = {};
  Object.keys(base).forEach(function(k) {
    var rel = (b === 0 || own[k] < 0) ? base[k] : own[k];
    out[k] = rel >= 0 ? off + rel : -1;
  });
  return out;
}
function makeRec(row, b, colsB) {
  var cols = colsB[b];
  return { row: row, b: b, cols: cols, val: function(k) {
    var v = cols[k] >= 0 ? cell(row, cols[k]) : '';
    if (!v && b > 0 && (k === 'dc' || k === 'do') && colsB[0][k] >= 0) v = cell(row, colsB[0][k]);
    return v;
  } };
}

var SEARCH_RECS = [], SEARCH_TOTAL = 0, SEARCH_SHOW = 50;

function runSearch() {
  var f = {};
  ['dc','wo','do','produk','batch','bin','pcs'].forEach(function(k) { f[k] = el('s-' + k).value.trim().toLowerCase(); });
  var all = el('s-all').value.trim().toLowerCase();
  var stats = el('search-stats'), box = el('search-results');
  if (!T.md2.ok) {
    stats.textContent = 'Master Data 2 belum termuat';
    box.innerHTML = '<div class="search-empty"><div class="ico">⏳</div>Menunggu Master Data 2...</div>';
    return;
  }
  var H = T.md2.headers, nB = Math.max(1, Math.ceil(H.length / BLOCK)), base = baseCols(), colsB = [];
  for (var b = 0; b < nB; b++) colsB.push(blockCols(b, base));
  var nonEmpty = function(c) { return String(c).trim() !== ''; };

  SEARCH_RECS = []; SEARCH_TOTAL = 0;
  T.md2.rows.forEach(function(row) {
    for (var b = 0; b < nB; b++) {
      var part = row.slice(b * BLOCK, (b + 1) * BLOCK);
      if (!part.some(nonEmpty)) continue;          // blok kosong dilewati
      SEARCH_TOTAL++;
      var rec = makeRec(row, b, colsB), cols = colsB[b], hay = null;
      var text = function() { return hay === null ? (hay = (part.join(' ') + ' ' + rec.val('dc') + ' ' + rec.val('do')).toLowerCase()) : hay; };
      if (all && text().indexOf(all) < 0) continue;
      var ok = true;
      for (var k in f) {
        if (!f[k]) continue;
        var src = cols[k] >= 0 ? rec.val(k).toLowerCase() : text();
        if (src.indexOf(f[k]) < 0) { ok = false; break; }
      }
      if (ok) SEARCH_RECS.push(rec);
    }
  });
  SEARCH_SHOW = 50;
  renderSearchCards();
}

// ==================== BARCODE CODE 128 ====================
var C128 = ['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];

function code128Widths(text) {
  text = String(text || '');
  if (!text) return [];
  var vals = [], i = 0;
  if (/^\d{4,}$/.test(text)) {
    if (text.length % 2 === 1) { vals.push(104, text.charCodeAt(0) - 32, 99); i = 1; } else vals.push(105);
    for (; i < text.length; i += 2) vals.push(parseInt(text.substr(i, 2), 10));
  } else {
    vals.push(104);
    for (i = 0; i < text.length; i++) { var c = text.charCodeAt(i); vals.push((c < 32 || c > 126) ? 31 : c - 32); }
  }
  var sum = vals[0];
  for (i = 1; i < vals.length; i++) sum += vals[i] * i;
  vals.push(sum % 103, 106);
  var w = [];
  vals.forEach(function(v) { C128[v].split('').forEach(function(d) { w.push(parseInt(d, 10)); }); });
  return w;
}

// ==================== GAMBAR LABEL ====================
var SIZES = { '76x50': [76, 50, 8.5], 'a4l': [140, 99, 13], 'a4p2': [99, 140, 11] };
var DPMM = 300 / 25.4;

function drawLabel(d, sizeKey) {
  var sz = SIZES[sizeKey] || SIZES['76x50'], W = sz[0], H = sz[1], f = sz[2] * 0.3528, S = DPMM;
  var cv = document.createElement('canvas');
  cv.width = Math.round(W * S); cv.height = Math.round(H * S);
  var c = cv.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height);
  c.fillStyle = '#000'; c.textBaseline = 'alphabetic';
  var FF = ' Arial, Helvetica, sans-serif';

  function setFont(mm, bold) { c.font = (bold ? 'bold ' : '') + (mm * S) + 'px' + FF; }
  function width(s, mm, bold) { setFont(mm, bold); return c.measureText(s).width / S; }
  function txt(s, x, y, mm, bold, align, maxW) {
    var size = mm;
    if (maxW) { var w = width(s, mm, bold); if (w > maxW) size = mm * maxW / w; }
    setFont(size, bold); c.textAlign = align || 'left'; c.fillText(s, x * S, y * S);
  }

  var padX = 3.5, padY = 3, inner = W - 2 * padX, lh = f * 1.35;
  var y1 = padY + f * 1.05, y2 = y1 + lh, y3 = y2 + lh + 2.5;
  var kx = padX, vx = padX + 0.30 * inner + 2, right = W - padX;

  txt('No DO', kx, y1, f);
  var toStr = d.to ? 'To  ' + d.to : '';
  var toW = toStr ? width(toStr, f) : 0;
  if (toStr) txt(toStr, right, y1, f, false, 'right');
  txt(d.doNum, vx, y1, f, false, 'left', right - toW - 3 - vx);
  txt('Ship to Desc', kx, y2, f);
  txt(d.shipTo || '-', vx, y2, f, false, 'left', right - vx);
  txt('Resource :', kx, y3, f);
  txt(d.resource || '-', vx, y3, f, false, 'left', right - vx);

  var tsBase = H - padY - f * 0.25, numBase = tsBase - f * 1.55;
  var bcBottom = numBase - f * 1.2, bcH = f * 4, bcTop = bcBottom - bcH;

  var nF = f * 2.6, uF = f * 1.3;
  var qW = Math.max(width(d.qty, nF, true), width(d.unit, uF, true));
  var qx = right - qW;
  txt(d.unit, qx, numBase, uF, true);
  txt(d.qty, qx, numBase - uF * 1.1 - 0.8, nF, true);

  var widths = code128Widths(d.hu);
  if (widths.length) {
    var total = widths.reduce(function(a, b) { return a + b; }, 0);
    var avail = (qx - 2 - padX) * S;
    var unit = Math.max(1, Math.floor(avail / (total + 10)));
    var x = padX * S + 5 * unit;
    widths.forEach(function(w, i) {
      if (i % 2 === 0) c.fillRect(x, bcTop * S, w * unit, bcH * S);
      x += w * unit;
    });
  }
  txt(d.hu || '', padX, numBase, f * 1.15);
  txt('Timestamp: ' + d.ts, padX, tsBase, f);
  return { canvas: cv, W: W, H: H };
}

function getTimestamp() {
  var n = new Date(), p = function(v) { return String(v).padStart(2, '0'); };
  return 'B' + p(n.getDate()) + '-' + p(n.getMonth() + 1) + '-' + n.getFullYear() + ' ' + p(n.getHours()) + ':' + p(n.getMinutes());
}

var LAST = null;
var LAST_DATA = null;
var _liveTimer = null;

function liveLabel() {
  if (_liveTimer) clearTimeout(_liveTimer);
  _liveTimer = setTimeout(renderLiveLabel, 120);
}

function renderLiveLabel() {
  var q = el('search-do').value.trim();
  var out = el('label-output');
  var size = el('label-size').value;
  var copies = Math.max(1, Math.min(50, parseInt(el('copies').value, 10) || 1));
  var resource = el('resource-sel').value;
  var qty = el('koli-qty').value.trim() || '1';
  var unit = el('koli-unit').value.trim() || 'CAR';
  var hu = el('ship-hu').value.trim();

  var r = q ? findLabelData(q) : { doNum: '', to: '', shipTo: '', in1: false, in2: false };
  var d = {
    doNum: r.doNum || q || '—',
    to: r.to || el('to-auto').value || '',
    shipTo: r.shipTo || el('ship-auto').value || '',
    resource: resource || '—',
    qty: qty,
    unit: unit,
    hu: hu || '',
    ts: getTimestamp()
  };

  var res = drawLabel(d, size);
  LAST = { url: res.canvas.toDataURL('image/png'), W: res.W, H: res.H, doNum: d.doNum, copies: copies };
  LAST_DATA = { d: d, size: size, copies: copies };

  el('page-style').textContent = '@page{size:' + res.W + 'mm ' + res.H + 'mm;margin:0}';

  var note = '';
  if (!q) note = 'Isi No DO untuk data otomatis';
  else if (!r.in1 && !r.in2) note = 'No DO tidak ditemukan di Master Data';
  else if (!resource) note = 'Pilih picker';
  else if (!hu) note = 'Isi No Ship HU';

  out.innerHTML =
    '<div class="preview">' +
      '<div class="cap">Label live (' + res.W + '×' + res.H + ' mm)' + (copies > 1 ? ' · ' + copies + ' salinan' : '') +
        (note ? ' — <span style="color:var(--accent2)">' + note + '</span>' : '') + '</div>' +
      previewImgs(res.W, copies) +
      '<div class="actions">' +
        '<button class="btn btn-primary" onclick="openPdf()">👁 Buka PDF</button>' +
        '<button class="btn btn-warn" onclick="downloadPdf()">⬇ Download PDF</button>' +
        '<button class="btn btn-success" onclick="doPrint()">🖨️ Print</button>' +
      '</div>' +
    '</div>';
}

function generateLabel() { renderLiveLabel(); if (LAST_DATA) { saveHist(LAST_DATA.d, LAST_DATA.size, LAST_DATA.copies); savePref(); renderHist(); } }

function doPrint() {
  if (LAST_DATA) { saveHist(LAST_DATA.d, LAST_DATA.size, LAST_DATA.copies); savePref(); renderHist(); }
  window.print();
}

function buildPdf() {
  if (!LAST) return null;
  var J = window.jspdf && window.jspdf.jsPDF;
  if (!J) { toast('Library PDF belum termuat (cek koneksi internet)', 3500); return null; }
  var doc = new J({ orientation: LAST.W > LAST.H ? 'landscape' : 'portrait', unit: 'mm', format: [Math.min(LAST.W, LAST.H), Math.max(LAST.W, LAST.H)] });
  doc.addImage(LAST.url, 'PNG', 0, 0, LAST.W, LAST.H);
  for (var i = 1; i < (LAST.copies || 1); i++) {
    doc.addPage([Math.min(LAST.W, LAST.H), Math.max(LAST.W, LAST.H)], LAST.W > LAST.H ? 'landscape' : 'portrait');
    doc.addImage(LAST.url, 'PNG', 0, 0, LAST.W, LAST.H);
  }
  return doc;
}

function openPdf() {
  if (LAST_DATA) { saveHist(LAST_DATA.d, LAST_DATA.size, LAST_DATA.copies); savePref(); renderHist(); }
  var doc = buildPdf(); if (!doc) return;
  var url = URL.createObjectURL(doc.output('blob'));
  var w = window.open(url, '_blank');
  if (!w) { toast('Pop-up diblokir. Izinkan pop-up atau pakai Download PDF.', 3500); }
}

function downloadPdf() {
  if (LAST_DATA) { saveHist(LAST_DATA.d, LAST_DATA.size, LAST_DATA.copies); savePref(); renderHist(); }
  var doc = buildPdf(); if (!doc) return;
  doc.save('Label_' + String(LAST.doNum).replace(/[^A-Za-z0-9_-]/g, '') + '.pdf');
}

function sortRows(t) {
  if (!t.sort || t.sort.col < 0) return;
  var c = t.sort.col, d = t.sort.dir;
  t.filtered = t.filtered.slice().sort(function(a, b) {
    var x = String(a[c] == null ? '' : a[c]), y = String(b[c] == null ? '' : b[c]);
    if (x === '' && y === '') return 0;
    if (x === '') return 1;
    if (y === '') return -1;
    return d * x.localeCompare(y, undefined, { numeric: true });
  });
}
function sortBy(k, i) {
  var t = T[k];
  if (!t.sort || t.sort.col !== i) t.sort = { col: i, dir: 1 };
  else if (t.sort.dir === 1) t.sort.dir = -1;
  else t.sort = null;
  applyFilter(k);
}

function exportCsv(k) {
  var t = T[k];
  if (!t.headers.length) { toast('Data belum termuat'); return; }
  var esc = function(v) { v = String(v == null ? '' : v); return /[",\n\r;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var lines = [t.headers.map(esc).join(',')];
  t.filtered.forEach(function(r) { lines.push(r.map(esc).join(',')); });
  var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (k === 'md1' ? 'MasterData1' : 'MasterData2') + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('✓ ' + t.filtered.length + ' baris diekspor ke CSV');
}

function setUpdated() {
  var n = new Date(), p = function(v) { return String(v).padStart(2, '0'); };
  el('upd').textContent = 'Diperbarui ' + p(n.getHours()) + ':' + p(n.getMinutes()) + ':' + p(n.getSeconds());
}
function refreshData() {
  toast('Memuat ulang data…', 1200);
  Promise.all([loadTable('md1'), loadTable('md2')]).then(function() {
    toast(T.md1.ok && T.md2.ok ? '✓ Data diperbarui' : 'Sebagian data gagal dimuat', 2000);
  });
}

function applyTheme() {
  var m = 'auto';
  try { m = localStorage.getItem('kd_theme') || 'auto'; } catch (e) {}
  if (m === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', m);
  return m;
}
function toggleTheme() {
  var m = 'auto';
  try { m = localStorage.getItem('kd_theme') || 'auto'; } catch (e) {}
  var next = { auto: 'light', light: 'dark', dark: 'auto' }[m];
  try { localStorage.setItem('kd_theme', next); } catch (e) {}
  applyTheme();
  toast('Tema: ' + { auto: 'otomatis', light: 'terang', dark: 'gelap' }[next], 1200);
}

function previewImgs(w, copies) {
  var h = '<img class="label-img" src="' + LAST.url + '" style="width:' + w + 'mm" alt="Pratinjau label"/>';
  for (var i = 1; i < copies; i++) h += '<img class="label-img print-only" src="' + LAST.url + '" style="width:' + w + 'mm" alt=""/>';
  return h;
}

var HIST = [];
try { HIST = JSON.parse(localStorage.getItem('kd_hist') || '[]') || []; } catch (e) { HIST = []; }
function savePref() {
  try { localStorage.setItem('kd_pref', JSON.stringify({ unit: el('koli-unit').value, size: el('label-size').value, copies: el('copies').value })); } catch (e) {}
}
function loadPref() {
  try {
    var p = JSON.parse(localStorage.getItem('kd_pref') || '{}');
    if (p.unit) el('koli-unit').value = p.unit;
    if (p.size) el('label-size').value = p.size;
    if (p.copies) el('copies').value = p.copies;
  } catch (e) {}
}
function saveHist(d, size, copies) {
  HIST = HIST.filter(function(h) { return !(h.doNum === d.doNum && h.hu === d.hu && h.qty === d.qty && h.unit === d.unit); });
  HIST.unshift({ doNum: d.doNum, qty: d.qty, unit: d.unit, hu: d.hu, resource: d.resource, size: size, copies: copies, ts: d.ts });
  HIST = HIST.slice(0, 15);
  try { localStorage.setItem('kd_hist', JSON.stringify(HIST)); } catch (e) {}
}
function renderHist() {
  var box = el('hist');
  if (!HIST.length) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="hist-head"><b>Riwayat cetak (ketuk untuk buka lagi)</b>' +
    '<button class="btn btn-outline btn-sm" onclick="clearHist()">Hapus</button></div>' +
    HIST.map(function(h, i) {
      return '<div class="hist-row" onclick="restoreHist(' + i + ')"><div><b>' + escHtml(h.doNum) + '</b> · ' + escHtml(h.qty) + ' ' + escHtml(h.unit) +
        (h.resource ? ' · ' + escHtml(h.resource) : '') + '</div><div class="hist-sub">' + escHtml(h.hu || '-') + ' · ' + escHtml(h.ts) + '</div></div>';
    }).join('');
}
function clearHist() { HIST = []; try { localStorage.removeItem('kd_hist'); } catch (e) {} renderHist(); }
function restoreHist(i) {
  var h = HIST[i]; if (!h) return;
  el('search-do').value = h.doNum; onDoChange();
  var rs = el('resource-sel');
  for (var j = 0; j < rs.options.length; j++) if (rs.options[j].value === h.resource) { rs.value = h.resource; break; }
  el('koli-qty').value = h.qty; el('koli-unit').value = h.unit;
  el('ship-hu').value = h.hu; el('label-size').value = h.size; el('copies').value = h.copies || 1;
  generateLabel();
  window.scrollTo(0, 0);
}
function resetForm() {
  ['search-do', 'ship-hu', 'to-auto', 'ship-auto'].forEach(function(id) { el(id).value = ''; });
  el('resource-sel').value = ''; el('koli-qty').value = 1; el('copies').value = 1;
  LAST = null; LAST_DATA = null;
  liveLabel();
  el('search-do').focus();
}

window.onload = function() {
  applyTheme(); loadPref(); renderHist();
  updateDataStatus(); refreshMd1Filters();
  loadTable('md1'); loadTable('md2');
  liveLabel();
};
</script>
</body>
</html>
